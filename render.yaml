services:
  - type: web
    name: marketnest-client-preview
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate --noinput && python manage.py seed_demo_catalog && python manage.py ensure_demo_admin && python manage.py import_local_admin
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost,127.0.0.1
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: "0"
      - key: MARKETNEST_DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: marketnest-client-preview-db
          property: connectionString
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: MARKETNEST_ADMIN_USERNAME
        sync: false
      - key: MARKETNEST_ADMIN_PASSWORD
        sync: false

databases:
  - name: marketnest-client-preview-db
    databaseName: marketnest_demo
    user: marketnest_demo
    plan: free
    postgresMajorVersion: "18"
