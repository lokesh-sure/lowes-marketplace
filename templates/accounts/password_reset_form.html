
{% extends "base.html" %}

{% block content %}
<style>
    .mn-reset-page,
    .mn-reset-page * {
        box-sizing: border-box;
    }

    .mn-reset-page {
        min-height: 500px;
        padding: 55px 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #f5f3ff, #eef2ff);
    }

    .mn-reset-card {
        width: 100%;
        max-width: 450px;
        padding: 38px;
        background: #fff;
        border: 1px solid #e8e5f5;
        border-radius: 18px;
        box-shadow: 0 12px 38px rgba(46, 30, 100, .12);
    }

    .mn-reset-card h1 {
        margin: 0 0 12px;
        color: #211b3b;
        text-align: center;
        font-size: 28px;
    }

    .mn-reset-card .mn-reset-description {
        margin-bottom: 28px;
        color: #77758a;
        text-align: center;
        line-height: 1.6;
        font-size: 14px;
    }

    .mn-reset-card label {
        display: block;
        margin-bottom: 8px;
        color: #29263d;
        font-size: 14px;
        font-weight: 600;
    }

    .mn-reset-card input[type="email"] {
        display: block;
        width: 100%;
        height: 48px;
        padding: 0 14px;
        border: 1px solid #dcd9e8;
        border-radius: 9px;
        outline: none;
        font-size: 15px;
    }

    .mn-reset-card input[type="email"]:focus {
        border-color: #6d4aff;
        box-shadow: 0 0 0 3px rgba(109, 74, 255, .13);
    }

    .mn-reset-submit {
        width: 100%;
        min-height: 49px;
        margin-top: 22px;
        border: 0;
        border-radius: 9px;
        background: linear-gradient(100deg, #5145e5, #842ee8);
        color: #fff;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
    }

    .mn-reset-back {
        display: block;
        margin-top: 23px;
        text-align: center;
        color: #6538d8;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
    }

    .mn-reset-errors {
        margin-bottom: 12px;
        color: #be123c;
        font-size: 14px;
    }

    @media (max-width: 480px) {
        .mn-reset-card {
            padding: 28px 22px;
        }
    }
</style>

<section class="mn-reset-page">
    <div class="mn-reset-card">
        <h1>Forgot Password?</h1>

        <p class="mn-reset-description">
            No worries! Enter your registered email address
            and we'll help you reset your password.
        </p>

        <form method="post">
            {% csrf_token %}

            {% if form.email.errors %}
                <div class="mn-reset-errors">
                    {{ form.email.errors }}
                </div>
            {% endif %}

            <label for="{{ form.email.id_for_label }}">
                Email Address
            </label>

            <input
                type="email"
                name="{{ form.email.html_name }}"
                id="{{ form.email.id_for_label }}"
                placeholder="you@example.com"
                autocomplete="email"
                required
            >

            <button type="submit" class="mn-reset-submit">
                Send Reset Link
            </button>
        </form>

        <a href="{% url 'accounts:login' %}" class="mn-reset-back">
            ← Back to Login
        </a>
    </div>
</section>
{% endblock %}
