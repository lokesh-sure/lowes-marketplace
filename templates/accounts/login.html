<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MarketNest</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body>

    <header>
        <div class="logo">MarketNest</div>

        <form action="/products/" method="get" style="display:contents"><input type="text" name="q" placeholder="🔍 Search products..."><button type="submit">Search</button></form>


        <a href="/"><button class="cart-btn">Home</button></a>
        <a href="/wishlist/"><button class="cart-btn">❤️ Wishlist</button></a>
        <a href="/cart/"><button class="cart-btn">🛒 Cart</button></a>
        <a href="/accounts/register/"><button class="cart-btn">Register</button></a>
    </header>

    <section class="product-details">

        <div class="login-container">

            <div class="login-card">

                <form method="post" action="/accounts/login/">
                    {% csrf_token %}
                    {% for message in messages %}<p role="alert" style="color:#b91c1c">{{ message }}</p>{% endfor %}

                    <h1>Login</h1>

                    <input type="email" name="email" value="{{ email }}" placeholder="Enter Email" required autocomplete="email">

                    <input type="password" name="password" placeholder="Enter Password" required
                        autocomplete="current-password">

                    <button class="cart-btn" type="submit">Login</button>

                    <p style="text-align:right;margin:15px 0;">
                        <a href="/accounts/password-reset/" style="text-decoration:none;color:#5B21B6;">Forgot Password?</a>
                    </p>

                    <p style="text-align:center;">
                        Don't have an account?
                        <a href="/accounts/register/">Register</a>
                    </p>

                </form>

            </div>

        </div>

    </section>

    <footer>
        <p><strong>MarketNest</strong></p>
        <p>
            <a href="/pages/about/">About</a> |
            <a href="/pages/privacy/">Privacy Policy</a> |
            <a href="/pages/contact/">Contact</a> |
            <a href="/pages/help/">Help Center</a>
        </p>
        <p>© 2026 MarketNest. All Rights Reserved.</p>
    </footer>

</body>

</html>
