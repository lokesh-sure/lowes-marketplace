<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - MarketNest</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body>

    <header>
        <div class="logo">MarketNest</div>

        <form action="/products/" method="get" style="display:contents"><input type="text" name="q" placeholder="🔍 Search products..."><button type="submit">Search</button></form>


        <a href="/"><button class="cart-btn">Home</button></a>
        <a href="/wishlist/"><button class="cart-btn">❤️ Wishlist</button></a>
        <a href="/cart/"><button class="cart-btn">🛒 Cart</button></a>
        <a href="/accounts/login/"><button class="cart-btn">Login</button></a>
    </header>

    <section class="product-details">

        <div class="login-container">

            <div class="login-card">

                <form method="post" action="/accounts/register/">
                    {% csrf_token %}
                    {% for message in messages %}<p role="alert" style="color:#b91c1c">{{ message }}</p>{% endfor %}

                    <h1>Create Account</h1>

                    <input type="text" name="full_name" value="{{ full_name }}" placeholder="Full Name" required autocomplete="name">

                    <input type="email" name="email" value="{{ email }}" placeholder="Email Address" required autocomplete="email">

                    <input type="password" name="password" placeholder="Password" required autocomplete="new-password">

                    <input type="password" name="confirm_password" placeholder="Confirm Password" required autocomplete="new-password">

                    <label style="font-size:14px;display:block;margin:15px 0;">
                        <input type="checkbox" name="terms" value="accepted" required>
                        I agree to the Terms & Conditions
                    </label>

                    <button class="cart-btn" type="submit">Register</button>

                    <p style="text-align:center;margin-top:20px;">
                        Already have an account?
                        <a href="/accounts/login/">Login</a>
                    </p>

                </form>

            </div>

        </div>

    </section>

    <footer>
        <p><strong>MarketNest</strong></p>
        <p>
            <a href="/pages/about/">About</a> |
            <a href="/pages/privacy/">Privacy Policy</a> |
            <a href="/pages/contact/">Contact</a> |
            <a href="/pages/help/">Help Center</a>
        </p>
        <p>© 2026 MarketNest. All Rights Reserved.</p>
    </footer>

</body>

</html>
