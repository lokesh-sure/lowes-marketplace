{% extends "base.html" %}

{% block title %}Admin Portal - PreciousCart{% endblock %}

{% block content %}
<section class="product-details">
    <div class="login-container">
        <div class="login-card">
            <h1>Store Admin</h1>
            <p>Sign in to manage your product catalog and customer accounts.</p>
            <form method="post" action="{% url 'pages:admin_access' %}">
                {% csrf_token %}
                <label for="admin-username">Admin username</label>
                <input id="admin-username" type="text" name="username" required autocomplete="username" autofocus>

                <label for="admin-password">Password</label>
                <input id="admin-password" type="password" name="password" required autocomplete="current-password">

                <button class="cart-btn" type="submit">Sign in</button>
            </form>
            <p style="text-align:center;margin-top:18px;">Use the staff account configured for this store.</p>
        </div>
    </div>
</section>
{% endblock %}
